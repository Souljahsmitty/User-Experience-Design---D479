<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Book Your Trip | Taniti Island</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #1f1f1f;
      color: white;
    }

    header {
      background-color: #004466;
      color: white;
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .nav-links {
      display: flex;
      gap: 20px;
    }

    .nav-links a {
      color: white;
      text-decoration: none;
      font-weight: bold;
      transition: color 0.3s;
    }

    .nav-links a:hover {
      color: #ffa600;
    }

    h1 {
      text-align: center;
      margin: 30px 0;
    }

    .section {
      max-width: 800px;
      margin: 0 auto;
      background-color: #2e2e2e;
      padding: 30px;
      border-radius: 8px;
    }

    .section h3 {
      color: #ffa726;
      margin-bottom: 20px;
    }

    .booking-form input,
    .booking-form select {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      border: none;
      border-radius: 4px;
      background-color: #444;
      color: white;
    }

    .booking-form button {
      width: 100%;
      padding: 12px;
      background-color: orange;
      border: none;
      border-radius: 4px;
      color: black;
      font-weight: bold;
      cursor: pointer;
    }

    footer {
      background-color: #003348;
      text-align: center;
      padding: 15px;
      color: #ccc;
      margin-top: 30px;
    }
  </style>
</head>
<body>

  <header>
    <h2>Visit Taniti</h2>
    <nav>
      <div class="nav-links">
        <a href="Index.html">Home</a>
        <a href="Restaurant.html">Restaurants</a>
        <a href="things-to-do enhanced.html">Things to Do</a>
        <a href="travel-info.html">Travel Info</a>
      </div>
    </nav>
  </header>

  <main>
    <h1>Book Your Trip</h1>

    <section class="section booking-form">
      <h3>Reservation Details</h3>
      <form>
        <label for="experience">Select Experience:</label>
        <select id="experience" required>
          <option value="">-- Choose an activity --</option>
          <option value="outdoor">Outdoor Adventure</option>
          <option value="cultural">Cultural Experience</option>
          <option value="beach">Beach Relaxation</option>
        </select>

        <label for="date">Preferred Date:</label>
        <input type="date" id="date" required />

        <label for="guests">Number of Guests:</label>
        <input type="number" id="guests" min="1" max="20" required />

        <label for="name">Your Name:</label>
        <input type="text" id="name" required />

        <label for="email">Your Email:</label>
        <input type="email" id="email" required />

        <button type="submit">Book Now</button>
      </form>
    </section>
  </main>

  <footer>
    &copy; 2025 Taniti Tourism Board | Your Dream Trip Awaits
  </footer>
</body>
</html>
