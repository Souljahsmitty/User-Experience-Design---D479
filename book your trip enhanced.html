<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Book Your Trip – Visit Taniti</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f4f4;
    }

    header {
      background-color: #006994;
      padding: 20px;
      color: white;
      text-align: center;
    }

    nav {
      background-color: #004d73;
      display: flex;
      justify-content: center;
      gap: 40px;
      padding: 12px 0;
    }

    nav a {
      color: white;
      text-decoration: none;
      font-weight: bold;
      font-size: 16px;
    }

    nav a:hover {
      text-decoration: underline;
    }

    .hero {
      background-image: url('https://images.pexels.com/photos/2886211/pexels-photo-2886211.jpeg');
      height: 300px;
      background-size: cover;
      background-position: center;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 36px;
      font-weight: bold;
      text-shadow: 2px 2px 6px rgba(0,0,0,0.5);
    }

    .section {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 30px;
      padding: 40px 20px;
      background-color: #fff;
    }

    .card {
      width: 300px;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      background-color: white;
      text-align: center;
    }

    .card img {
      width: 100%;
      height: 200px;
      object-fit: cover;
    }

    .card h3 {
      margin: 16px;
      font-size: 20px;
    }

    .btn {
      background-color: #0078c4;
      color: white;
      padding: 12px 24px;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      margin: 20px auto;
      display: block;
      cursor: pointer;
    }

    .btn:hover {
      background-color: #005f99;
    }
	/* Unified Button Style */
    .nav-button {
      background: #ffa600;
      color: white;
      text-decoration: none;
      padding: 14px 28px;
      border-radius: 8px;
      font-size: 16px;
      box-shadow: 2px 2px 6px rgba(0,0,0,0.15);
      cursor: pointer;
      display: inline-block;
      text-align: center;
      transition: background 0.3s;
    }
	.nav-button:hover {
      background: #ff7c00;
    }
    footer {
      background-color: #00334d;
      color: white;
      text-align: center;
      padding: 20px 10px;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <header>
    <h1>Visit Taniti</h1>
  </header>

  <nav>
    
	<a href="index.html">Home</a>
    <a href="things-to-do enhanced.html">Things to Do</a>
    
    <a href="travel-info.html">travel-info</a>
	<a href="Restaurant.html">Restaurants</a>
  </nav>

  

  <section class="section">
    <div class="card">
      <img src="https://images.pexels.com/photos/258154/pexels-photo-258154.jpeg" alt="Lodging">
      <h3>Lodging Options</h3>
    </div>

    <div class="card">
      <img src="https://images.pexels.com/photos/358070/pexels-photo-358070.jpeg" alt="Transportation">
      <h3>Transportation</h3>
    </div>

    <div class="card">
      <img src="https://images.pexels.com/photos/3769138/pexels-photo-3769138.jpeg" alt="Trip Confirmation">
      <h3>Trip Confirmation</h3>
    </div>
  </section>

  <button class="btn" onclick="location.href='book-your-trip.html'">Submit Booking</button>

  <footer>
    &copy; 2025 Explore Taniti – Plan your paradise escape today!
  </footer>

</body>
</html>
